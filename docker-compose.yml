version: '1.0'

services:
  db:
    image: postgres:15.1
    expose:
      - 5432
    env_file:
      - .env
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  backend:
    build: ./backend
    # image: jasonbigcow/oauth2-fastapi
    ports:
      - 8008:8008
    volumes:
      - ./backend/:/usr/backend/
    env_file:
      - ./backend/production.env
      - ./backend/.env
    command: python3 run.py --prod
    restart: always
    depends_on:
      - db

volumes:
  postgres_data:

networks:
  default:
    name: fastapi_vue_network
